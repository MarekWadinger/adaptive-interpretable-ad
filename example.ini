[setup]
recovery_path=.recovery_models
key_path=.security
debug=False

[model]
threshold=0.997358
t_e=1d
t_a=1d
t_g=1d
; JSON mapping of signal name to its static [low, high] physical bounds,
; e.g. {"plant/a": [0.0, 100.0]}
physical_limits=

[io]
in_topics=
out_topics=

; Exactly one transport section may be fully specified; the service
; rejects a config that enables several at once. MQTT is live below,
; the others are kept as commented templates.
[mqtt]
host=mqtt.cloud.uiam.sk
port=1883

[kafka]
;bootstrap_servers=localhost:9092

[pulsar]
;service_url=pulsar://localhost:6650

[nats]
; one URL, or several comma-separated for a cluster
;servers=nats://localhost:4222

[redis]
; redis:// or rediss:// URL accepted by redis.Redis.from_url
;url=redis://localhost:6379/0
; pubsub (default): channels like MQTT topics, no persistence
; stream: Redis Streams (XADD/XREAD), an append-only log like Kafka
;mode=pubsub

[email]
sender_email=
sender_password=
recipient_email=
